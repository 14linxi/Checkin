name: Daily check-in

on:
  schedule:
    # GitHub Actions uses UTC. 23:00 UTC is 07:00 the next day in Beijing.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      run_sf:
        description: "运行顺丰速运"
        type: boolean
        required: false
        default: true
      run_enshan:
        description: "运行恩山论坛"
        type: boolean
        required: false
        default: true
      run_kanxue:
        description: "运行看雪论坛"
        type: boolean
        required: false
        default: true
      run_shyp:
        description: "运行上海杨浦"
        type: boolean
        required: false
        default: true
      run_huaruntong_999:
        description: "运行华润通万象星"
        type: boolean
        required: false
        default: true
      run_huaruntong_wx:
        description: "运行华润通微信版"
        type: boolean
        required: false
        default: true
      run_huaruntong_wentiweilaihui:
        description: "运行华润通文体未来荟"
        type: boolean
        required: false
        default: true
      run_erke:
        description: "运行鸿星尔克"
        type: boolean
        required: false
        default: true
      run_wps:
        description: "运行 WPS Office"
        type: boolean
        required: false
        default: true
      run_smzdm:
        description: "运行什么值得买"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: daily-check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare private configuration
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          NOTIFICATION_JSON: ${{ secrets.NOTIFICATION_JSON }}
        run: |
          set -euo pipefail

          if [ -z "$TOKEN_JSON" ]; then
            echo "::error::The TOKEN_JSON repository secret is not configured."
            exit 1
          fi

          mkdir -p config
          printf '%s' "$TOKEN_JSON" > config/token.json
          python -m json.tool config/token.json > /dev/null

          if [ -n "$NOTIFICATION_JSON" ]; then
            printf '%s' "$NOTIFICATION_JSON" > config/notification.json
            python -m json.tool config/notification.json > /dev/null
          fi

      - name: Run check-in scripts
        env:
          RUN_SF: ${{ github.event_name == 'schedule' || inputs.run_sf }}
          RUN_ENSHAN: ${{ github.event_name == 'schedule' || inputs.run_enshan }}
          RUN_KANXUE: ${{ github.event_name == 'schedule' || inputs.run_kanxue }}
          RUN_SHYP: ${{ github.event_name == 'schedule' || inputs.run_shyp }}
          RUN_HUARUNTONG_999: ${{ github.event_name == 'schedule' || inputs.run_huaruntong_999 }}
          RUN_HUARUNTONG_WX: ${{ github.event_name == 'schedule' || inputs.run_huaruntong_wx }}
          RUN_HUARUNTONG_WENTIWEILAIHUI: ${{ github.event_name == 'schedule' || inputs.run_huaruntong_wentiweilaihui }}
          RUN_ERKE: ${{ github.event_name == 'schedule' || inputs.run_erke }}
          RUN_WPS: ${{ github.event_name == 'schedule' || inputs.run_wps }}
          RUN_SMZDM: ${{ github.event_name == 'schedule' || inputs.run_smzdm }}
        run: |
          set +e
          failed=0

          run_script() {
            enabled="$1"
            script="$2"

            if [ "$enabled" != "true" ]; then
              echo "Skipping $script"
              return
            fi

            echo "::group::Running $script"
            python "$script"
            status=$?
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "::error file=$script::Script failed with exit code $status"
              failed=1
            fi
          }

          run_script "$RUN_SF" script/sf/main.py
          run_script "$RUN_ENSHAN" script/enshan/sign_in.py
          run_script "$RUN_KANXUE" script/kanxue/sign_in.py
          run_script "$RUN_SHYP" script/shyp/main.py
          run_script "$RUN_HUARUNTONG_999" script/huaruntong/999/main.py
          run_script "$RUN_HUARUNTONG_WX" script/huaruntong/huaruntong_wx/main.py
          run_script "$RUN_HUARUNTONG_WENTIWEILAIHUI" script/huaruntong/wentiweilaihui/main.py
          run_script "$RUN_ERKE" script/erke/main.py
          run_script "$RUN_WPS" script/wps/main.py
          run_script "$RUN_SMZDM" script/smzdm/sign_daily_task/main.py

          exit "$failed"
